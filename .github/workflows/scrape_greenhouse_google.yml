name: Greenhouse Google Scraper

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./dashboard

jobs:
  scrape-and-commit:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m playwright install chromium
          python -m patchright install chromium

      - name: Run Greenhouse Google Scraper
        run: |
          cd greenhouse
          python greenhouse_google.py
        env:
          PYTHONUNBUFFERED: "1"
          
      # Upload the json file generated by the script just in case the commit fails
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: greenhouse-google-jobs
          path: greenhouse/*.json

      - name: Move files to root directory
        run: |
          find greenhouse -name "*.json" -exec mv {} ./ \;

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Greenhouse Google fetch update 🤖"
          file_pattern: '*.json'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
