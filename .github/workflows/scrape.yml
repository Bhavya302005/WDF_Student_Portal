name: Daily Job Scraper (Parallel)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # 1. Run all job boards in parallel
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # If one board fails, let the others finish
      matrix:
        # List of boards supported by your pipeline's Type A lane
        board: [Ashby, Greenhouse, Lever, Workday, SmartRecruiters, Workable, iCIMS, Jobvite, BambooHR, Teamtailor, Dice, Adp]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper for ${{ matrix.board }}
        timeout-minutes: 360
        run: |
          python pipeline.py --type-a-only --local-only --boards ${{ matrix.board }} --exclude-boards none --output ${{ matrix.board }}_jobs.json
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PYTHONUNBUFFERED: "1"
          MAX_CONCURRENT_JOBS: "800"
          WORKDAY_COMPANY_CONCURRENCY: "400"
          WORKDAY_DETAIL_CONCURRENCY: "1000"
          WORKDAY_TENANT_DETAIL_CONCURRENCY: "80"
          WORKDAY_DETAIL_REQUEST_RATE: "500"
          WORKDAY_SKIP_DETAILS: "false"
          WORKDAY_POST_TIME: "day"
          BAMBOOHR_LIST_CONCURRENCY: "500"
          BAMBOOHR_DETAIL_CONCURRENCY: "200"
          BAMBOOHR_SKIP_DETAILS: "false"
          BAMBOOHR_POST_TIME: "day"
          GREENHOUSE_CONCURRENCY: "800"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.board }}
          path: ${{ matrix.board }}_jobs.json

  # 2. Wait for all boards to finish, then commit them together to avoid Git conflicts
  commit:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all job artifacts
        uses: actions/download-artifact@v4
        with:
          path: scraped_jobs/
          
      - name: Move files to root directory
        run: |
          # The download-artifact action puts them in folders, let's move them out
          find scraped_jobs -name "*.json" -exec mv {} ./ \;
          rm -rf scraped_jobs

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated job fetch update (Parallel) 🤖"
          file_pattern: '*.json'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
