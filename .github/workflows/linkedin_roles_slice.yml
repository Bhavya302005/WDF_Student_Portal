name: LinkedIn Roles Scraper (Slice)

# -- Which slice of the 68 roles this repo runs -------------------------------
# These are 1-based role numbers (--start-idx / --end-idx in the scraper).
# Repo A (roles 1-23):  ROLE_START=1   ROLE_END=23
# Repo B (roles 24-45): ROLE_START=24  ROLE_END=45
# Repo C (roles 46-68): ROLE_START=46  ROLE_END=68
# Change these two env vars per repo - everything else stays identical.
env:
  ROLE_START: "1"
  ROLE_END: "23"

on:
  workflow_dispatch:
    inputs:
      post_time:
        description: "How far back to look for jobs"
        required: false
        default: "week"
        type: choice
        options: [day, week, month, any]
      shards:
        description: "Number of parallel runners (4-16 recommended)"
        required: false
        default: "8"
        type: choice
        options: ["4", "8", "12", "16"]

jobs:
  # -- 1. Work out the shard list dynamically ----------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      shard_list: ${{ steps.gen.outputs.shard_list }}
      post_time:  ${{ steps.gen.outputs.post_time }}
    steps:
      - id: gen
        run: |
          N=${{ inputs.shards || '8' }}
          LIST=$(python3 -c "
          import json, sys
          n = int('$N')
          print(json.dumps([f'{i+1}/{n}' for i in range(n)]))
          ")
          echo "shard_list=$LIST" >> "$GITHUB_OUTPUT"
          echo "post_time=${{ inputs.post_time || 'week' }}" >> "$GITHUB_OUTPUT"

  # -- 2. Scrape - one runner per shard ----------------------------------------
  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shard_list) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: scrapers
        run: |
          pip install --quiet httpx python-dotenv pandas openpyxl

      - name: Scrape shard ${{ matrix.shard }} (roles ${{ env.ROLE_START }}-${{ env.ROLE_END }})
        working-directory: scrapers
        env:
          ROLE_START: ${{ env.ROLE_START }}
          ROLE_END:   ${{ env.ROLE_END }}
        run: |
          python3 linkedin/linkedin_68_roles.py \
            --post-time "${{ needs.plan.outputs.post_time }}" \
            --shard     "${{ matrix.shard }}" \
            --max-results all \
            --start-idx "${{ env.ROLE_START }}" \
            --end-idx   "${{ env.ROLE_END }}"

      - name: Upload shard CSV
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ strategy.job-index }}
          retention-days: 3
          path: |
            scrapers/linkedin/linkedin_jobs/*shard*

  # -- 3. Merge shards - enrich JDs - Excel ------------------------------------
  deliver:
    needs: [plan, scrape]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet httpx pandas openpyxl

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: scraped_data
          merge-multiple: false

      - name: Merge shards into master CSVs
        working-directory: scrapers
        run: |
          python3 - <<'EOF'
          import glob, csv, os, collections

          def read_shard(path):
              rows = []
              try:
                  with open(path, newline='', encoding='utf-8') as f:
                      rows = list(csv.DictReader(f))
              except Exception as e:
                  print(f'  skip {path}: {e}')
              return rows

          all_jobs    = {}   # id - row  (dedup)
          strict_jobs = {}

          for f in sorted(glob.glob('../scraped_data/**/linkedin_shard_*_jobs.csv', recursive=True)):
              for j in read_shard(f):
                  all_jobs.setdefault(j.get('id', ''), j)

          for f in sorted(glob.glob('../scraped_data/**/linkedin_shard_*_jobs_strict.csv', recursive=True)):
              for j in read_shard(f):
                  strict_jobs.setdefault(j.get('id', ''), j)

          os.makedirs('linkedin/linkedin_jobs', exist_ok=True)

          def write(rows, path):
              if not rows:
                  return
              with open(path, 'w', newline='', encoding='utf-8') as f:
                  w = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
                  w.writeheader(); w.writerows(rows)
              print(f'  {path}: {len(rows)} rows')

          write(list(all_jobs.values()),    'linkedin/linkedin_jobs/linkedin_jobs_all.csv')
          write(list(strict_jobs.values()), 'linkedin/linkedin_jobs/linkedin_jobs_strict.csv')
          EOF

      - name: Enrich with full job descriptions
        working-directory: scrapers
        continue-on-error: true
        run: |
          python3 -m job_extraction.enrich_csv \
            linkedin/linkedin_jobs/linkedin_jobs_all.csv    --board LinkedIn || true
          python3 -m job_extraction.enrich_csv \
            linkedin/linkedin_jobs/linkedin_jobs_strict.csv --board LinkedIn || true

      - name: Build Excel deliverable
        working-directory: scrapers
        run: |
          python3 - <<'EOF'
          import re, os, pandas as pd

          ILLEGAL = re.compile(
              r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f-\x84\x86-\x9f\ud800-\udfff--]'
          )

          def load(path):
              return pd.read_csv(path, dtype=str) if os.path.exists(path) else pd.DataFrame()

          def clean(df):
              for col in df.columns:
                  df[col] = (df[col].fillna('')
                               .astype(str)
                               .str.replace(r'\r\n|\r|\n', ' ', regex=True)
                               .apply(lambda x: ILLEGAL.sub('', x)))
              return df

          all_df    = load('linkedin/linkedin_jobs/linkedin_jobs_all.csv')
          strict_df = load('linkedin/linkedin_jobs/linkedin_jobs_strict.csv')

          # non-strict = rows in all but not in strict
          strict_ids = set(strict_df['id'].dropna()) if 'id' in strict_df.columns else set()
          other_df   = all_df[~all_df.get('id', pd.Series()).isin(strict_ids)].copy() \
                       if not all_df.empty else pd.DataFrame()

          # add sequential index
          def indexed(df):
              df = df.drop(columns=['Index_No'], errors='ignore').reset_index(drop=True)
              df.insert(0, 'Index_No', range(1, len(df)+1))
              return clean(df)

          os.makedirs('deliverables', exist_ok=True)

          slice_label = f"roles_{os.environ.get('ROLE_START','0')}_to_{os.environ.get('ROLE_END','68')}"

          # -- strict_jobs.xlsx --------------------------------------------------
          with pd.ExcelWriter(f'deliverables/strict_jobs_{slice_label}.xlsx', engine='openpyxl') as w:
              indexed(strict_df).to_excel(w, sheet_name='Strict', index=False)
              indexed(other_df).to_excel(w,  sheet_name='Other',  index=False)
              indexed(all_df).to_excel(w,    sheet_name='All',    index=False)
          print(f'strict_jobs_{slice_label}.xlsx - strict: {len(strict_df)}, other: {len(other_df)}, all: {len(all_df)}')

          # -- flat CSV (for combining across repos) ----------------------------
          indexed(all_df).to_csv(f'deliverables/all_jobs_{slice_label}.csv', index=False)
          indexed(strict_df).to_csv(f'deliverables/strict_jobs_{slice_label}.csv', index=False)
          EOF
        env:
          ROLE_START: ${{ env.ROLE_START }}
          ROLE_END:   ${{ env.ROLE_END }}

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-jobs-slice-${{ env.ROLE_START }}-${{ env.ROLE_END }}
          retention-days: 7
          path: scrapers/deliverables/
