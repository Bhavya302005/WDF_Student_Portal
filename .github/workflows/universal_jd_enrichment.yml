name: 🧠 Universal JD Enrichment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["🚀 Weekly Ultimate Scraper (All Boards + LI/Indeed)"]
    types:
      - completed

jobs:
  enrich-jobs:
    runs-on: ubuntu-latest
    # Only auto-run if the triggering workflow actually succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./dashboard
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run JD Enricher on all JSON files
        working-directory: ./dashboard
        run: |
          echo "Starting Universal JD Enrichment for Matching Algorithm..."

          # Find all ATS json files and enrich them inline
          shopt -s nullglob
          json_files=(*_jobs_weekly.json)
          if [ ${#json_files[@]} -eq 0 ]; then
            echo "No *_jobs_weekly.json files found in dashboard/. Skipping."
          else
            for file in "${json_files[@]}"; do
              echo "----------------------------------------"
              echo "Enriching $file..."
              python job_extraction/jd_enricher.py "$file" "$file"
              python job_extraction/jd_enricher.py "$file" --audit
            done
          fi

          echo "----------------------------------------"
          if [ -f "all_jobs_pipeline.json" ]; then
            echo "Enriching all_jobs_pipeline.json..."
            python job_extraction/jd_enricher.py all_jobs_pipeline.json all_jobs_pipeline.json
          fi

      - name: Commit and push enriched files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: run universal JD enrichment for matching algorithm 🧠"
          file_pattern: 'dashboard/*.json'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
