name: Daily Job Scraper (Heavy Boards Only)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./dashboard

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [BambooHR, Greenhouse, Workday, iCIMS]
        shard: [0, 1, 2, 3, 4]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Shard company list (1/5 of workload per runner)
        run: |
          if [ "${{ matrix.board }}" == "Workday" ]; then
            FILE="workday/workday.csv"
            HAS_HEADER=true
          elif [ "${{ matrix.board }}" == "BambooHR" ]; then
            FILE="bamboohr/bamboohr_companies.txt"
            HAS_HEADER=false
          elif [ "${{ matrix.board }}" == "Greenhouse" ]; then
            FILE="greenhouse/greenhouse_companies.txt"
            HAS_HEADER=false
          elif [ "${{ matrix.board }}" == "iCIMS" ]; then
            FILE="icims/icims_companies.txt"
            HAS_HEADER=false
          else
            echo "Unknown board!"
            exit 1
          fi
          
          if [ "$HAS_HEADER" = true ]; then
            HEADER=$(head -n 1 "$FILE")
            tail -n +2 "$FILE" > /tmp/content
          else
            cat "$FILE" > /tmp/content
          fi
          
          TOTAL_LINES=$(wc -l < /tmp/content)
          SHARD_SIZE=$(( (TOTAL_LINES + 4) / 5 ))
          
          # Split into chunks named chunk_00, chunk_01, etc.
          split -l $SHARD_SIZE -d /tmp/content /tmp/chunk_
          
          SHARD_STR=$(printf "%02d" ${{ matrix.shard }})
          
          if [ "$HAS_HEADER" = true ]; then
            echo "$HEADER" > "$FILE"
            if [ -f "/tmp/chunk_$SHARD_STR" ]; then
              cat "/tmp/chunk_$SHARD_STR" >> "$FILE"
            fi
          else
            if [ -f "/tmp/chunk_$SHARD_STR" ]; then
              cat "/tmp/chunk_$SHARD_STR" > "$FILE"
            else
              > "$FILE" # Empty file if shard has no data
            fi
          fi
          
          echo "Runner for shard ${{ matrix.shard }} has $(wc -l < "$FILE") items to process!"

      - name: Run Scraper for ${{ matrix.board }}
        run: |
          python pipeline.py --type-a-only --local-only --boards ${{ matrix.board }} --exclude-boards none --output ${{ matrix.board }}_jobs_${{ matrix.shard }}.json
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PYTHONUNBUFFERED: "1"
          MAX_CONCURRENT_JOBS: "400"
          WORKDAY_COMPANY_CONCURRENCY: "400"
          WORKDAY_DETAIL_CONCURRENCY: "1000"
          BAMBOOHR_LIST_CONCURRENCY: "400"
          BAMBOOHR_DETAIL_CONCURRENCY: "400"
          GREENHOUSE_CONCURRENCY: "400"
          ICIMS_PAGE_CONCURRENCY: "800"
          DETAIL_CONCURRENCY: "800"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.board }}-${{ matrix.shard }}
          path: ${{ matrix.board }}_jobs_${{ matrix.shard }}.json

  commit:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all job artifacts
        uses: actions/download-artifact@v4
        with:
          path: scraped_jobs/
          
      - name: Move files to root directory
        run: |
          find scraped_jobs -name "*.json" -exec mv {} ./ \;
          rm -rf scraped_jobs

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated job fetch update (Heavy Boards) 🤖"
          file_pattern: '*.json'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
