name: ⚡ Turbo Fast Scraper (32x Parallel + Full Descriptions)

on:
  workflow_dispatch:
    inputs:
      post_time:
        description: 'Post time window'
        required: true
        default: '3week'
        type: choice
        options:
          - '3week'
          - '2week'
          - 'week'
          - 'month'
          - 'day'
          - 'any'
      max_results:
        description: 'Max jobs per role ("all" = every available job — recommended)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - '500'
          - '200'
          - '100'
          - '50'
      fetch_descriptions:
        description: 'Fetch Full Descriptions (32-thread parallel — recommended ON)'
        required: true
        default: true
        type: boolean
      boards:
        description: 'Which boards to scrape'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'linkedin'
          - 'indeed'

defaults:
  run:
    working-directory: ./dashboard

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [linkedin, indeed]
        shard:
          - "1/16"
          - "2/16"
          - "3/16"
          - "4/16"
          - "5/16"
          - "6/16"
          - "7/16"
          - "8/16"
          - "9/16"
          - "10/16"
          - "11/16"
          - "12/16"
          - "13/16"
          - "14/16"
          - "15/16"
          - "16/16"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine if board should execute
        id: check
        run: |
          SELECTED="${{ github.event.inputs.boards || 'both' }}"
          CURRENT="${{ matrix.board }}"
          if [ "$SELECTED" != "both" ] && [ "$SELECTED" != "$CURRENT" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # httpx is required for 32-thread parallel description fetching
          pip install python-jobspy pandas python-dotenv openpyxl httpx

      - name: Scrape LinkedIn Shard ${{ matrix.shard }}
        if: steps.check.outputs.run == 'true' && matrix.board == 'linkedin'
        timeout-minutes: 300
        run: |
          POST_TIME="${{ github.event.inputs.post_time || '3week' }}"
          MAX_RES="${{ github.event.inputs.max_results || 'all' }}"
          # Descriptions enabled by default; pass --no-descriptions only if explicitly disabled
          DESC_FLAG=""
          if [ "${{ github.event.inputs.fetch_descriptions }}" = "false" ]; then
            DESC_FLAG="--no-descriptions"
          fi
          python linkedin/linkedin_68_roles.py \
            --post-time "$POST_TIME" \
            --shard "${{ matrix.shard }}" \
            --fast \
            --max-results "$MAX_RES" \
            $DESC_FLAG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Scrape Indeed Shard ${{ matrix.shard }}
        if: steps.check.outputs.run == 'true' && matrix.board == 'indeed'
        timeout-minutes: 300
        run: |
          POST_TIME="${{ github.event.inputs.post_time || '3week' }}"
          MAX_RES="${{ github.event.inputs.max_results || 'all' }}"
          python indeed/indeed_68_roles.py \
            --post-time "$POST_TIME" \
            --shard "${{ matrix.shard }}" \
            --fast \
            --max-results "$MAX_RES"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Upload Shard Artifact
        if: steps.check.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: turbo-jobs-${{ matrix.board }}-${{ strategy.job-index }}
          path: |
            linkedin/linkedin_jobs/*shard*
            indeed/indeed_jobs/*shard*
          if-no-files-found: ignore

  merge-and-commit:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all job artifacts
        uses: actions/download-artifact@v4
        with:
          path: scraped_shards/

      - name: Merge all shards into master datasets
        run: |
          python3 -c "
          import json, glob, os, re, csv
          from pathlib import Path
          from indeed.indeed_68_roles import ROLES

          roles_sorted = sorted([r.lower() for r in ROLES], key=len, reverse=True)
          strict_pattern = re.compile(r'\b(' + '|'.join(re.escape(r) for r in roles_sorted) + r')\b', re.IGNORECASE)

          def write_csv(items, path):
              if not items:
                  return
              fieldnames = list(items[0].keys())
              if 'Index_No' not in fieldnames:
                  fieldnames = ['Index_No'] + fieldnames
              with open(path, 'w', encoding='utf-8', newline='') as fp:
                  writer = csv.DictWriter(fp, fieldnames=fieldnames, quoting=csv.QUOTE_NONNUMERIC, escapechar='\\\\')
                  writer.writeheader()
                  for idx, item in enumerate(items, start=1):
                      row = dict(item)
                      row['Index_No'] = idx
                      writer.writerow(row)

          def read_shard(filepath):
              results = []
              if filepath.endswith('.json'):
                  with open(filepath, 'r', encoding='utf-8') as f:
                      return json.load(f)
              elif filepath.endswith('.csv'):
                  with open(filepath, 'r', encoding='utf-8') as f:
                      return list(csv.DictReader(f))
              return results

          # 1. Merge LinkedIn shards
          li_files = sorted(glob.glob('scraped_shards/**/linkedin_shard_*_jobs.*', recursive=True))
          li_jobs = []
          seen_li = set()
          for f in li_files:
              try:
                  data = read_shard(f)
                  for j in data:
                      jid = j.get('id') or (j.get('title','')+j.get('company','')+j.get('location',''))
                      if jid not in seen_li:
                          seen_li.add(jid)
                          li_jobs.append(j)
              except Exception as e:
                  print(f'Error reading {f}: {e}')

          if li_defaults:
  run:
    working-directory: ./dashboard

jobs:
              os.makedirs('linkedin/linkedin_jobs', exist_ok=True)
              # Master CSV (all 68 roles)
              write_csv(li_jobs, 'linkedin/linkedin_jobs/linkedin_68roles_jobs_us.csv')
              
              # Strict matching CSV
              li_strict = [j for j in li_jobs if strict_pattern.search(str(j.get('job_title', '')))]
              write_csv(li_strict, 'linkedin/linkedin_jobs/linkedin_68roles_jobs_us_strict.csv')
              print(f'LinkedIn: {len(li_jobs)} total jobs, {len(li_strict)} strict jobs.')
          else:
              print('No LinkedIn shard files found.')

          # 2. Merge Indeed shards
          ind_files = sorted(glob.glob('scraped_shards/**/indeed_shard_*_jobs.*', recursive=True))
          ind_jobs = []
          seen_ind = set()
          for f in ind_files:
              try:
                  data = read_shard(f)
                  for j in data:
                      jid = j.get('id') or (j.get('title','')+j.get('company','')+j.get('location',''))
                      if jid not in seen_ind:
                          seen_ind.add(jid)
                          ind_jobs.append(j)
              except Exception as e:
                  print(f'Error reading {f}: {e}')

          if ind_defaults:
  run:
    working-directory: ./dashboard

jobs:
              os.makedirs('indeed/indeed_jobs', exist_ok=True)
              # Master CSV (all 68 roles)
              write_csv(ind_jobs, 'indeed/indeed_jobs/indeed_68roles_jobs_us.csv')
              
              # Strict matching CSV
              ind_strict = [j for j in ind_jobs if strict_pattern.search(str(j.get('job_title', '')))]
              write_csv(ind_strict, 'indeed/indeed_jobs/indeed_68roles_jobs_us_strict.csv')
              print(f'Indeed: {len(ind_jobs)} total jobs, {len(ind_strict)} strict jobs.')
          else:
              print('No Indeed shard files found.')

          # 3. Combine BOTH platforms into 2 single master files
          combined_all = []
          seen_all = set()
          for j in (li_jobs + ind_jobs):
              key = (str(j.get('job_title', '')).strip().lower() + '|' +
                     str(j.get('company', '')).strip().lower() + '|' +
                     str(j.get('location', '')).strip().lower())
              if key not in seen_all:
                  seen_all.add(key)
                  combined_all.append(j)

          combined_strict = [j for j in combined_all if strict_pattern.search(str(j.get('job_title', '')))]

          write_csv(combined_all, 'all_68roles_jobs_us.csv')
          write_csv(combined_strict, 'all_68roles_jobs_us_strict.csv')
          print(f'Combined: {len(combined_all)} all jobs, {len(combined_strict)} strict jobs across both platforms.')

          # Clean up any non-CSV / unnecessary files from output dirs
          for directory, prefix in [('linkedin/linkedin_jobs', 'linkedin'), ('indeed/indeed_jobs', 'indeed')]:
              if os.path.exists(directory):
                  for fname in os.listdir(directory):
                      if fname not in [f'{prefix}_68roles_jobs_us.csv', f'{prefix}_68roles_jobs_us_strict.csv']:
                          fpath = os.path.join(directory, fname)
                          if os.path.isfile(fpath):
                              os.remove(fpath)
          "
          rm -rf scraped_shards

      - name: Upload Merged Master CSVs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-merged-csvs
          path: |
            all_68roles_jobs_us*.csv
            linkedin/linkedin_jobs/*.csv
            indeed/indeed_jobs/*.csv
          if-no-files-found: warn

      - name: Commit and push combined datasets
        id: commit
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "⚡ Turbo Scrape — 2 Master CSVs (All Roles & Strict Matching) 🤖"
          file_pattern: 'all_68roles_jobs_us*.csv linkedin/linkedin_jobs/*.csv indeed/indeed_jobs/*.csv'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
