name: Scrape Updated Boards (Workday, BambooHR, Greenhouse)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./dashboard

jobs:
  # ── Workday: 4 parallel shards (each handles ~660 companies) ──────────
  scrape-workday:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Workday Shard ${{ matrix.shard }}
        timeout-minutes: 300
        run: |
          SHARD_LABEL=$(echo "${{ matrix.shard }}" | tr '/' '-')
          python pipeline.py --type-a-only --local-only --boards Workday --exclude-boards none --output "Workday_shard_${SHARD_LABEL}_jobs.json"
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PYTHONUNBUFFERED: "1"
          WORKDAY_SHARD: ${{ matrix.shard }}
          WORKDAY_COMPANY_CONCURRENCY: "400"
          WORKDAY_DETAIL_CONCURRENCY: "800"
          WORKDAY_TENANT_DETAIL_CONCURRENCY: "40"
          WORKDAY_DETAIL_REQUEST_RATE: "300"
          WORKDAY_SKIP_DETAILS: "false"
          WORKDAY_POST_TIME: "day"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobs-Workday-${{ strategy.job-index }}
          path: Workday_shard_*_jobs.json

  # ── BambooHR & Greenhouse: single job each ────────────────────────────
  scrape-other:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [BambooHR, Greenhouse]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper for ${{ matrix.board }}
        timeout-minutes: 300
        run: |
          python pipeline.py --type-a-only --local-only --boards ${{ matrix.board }} --exclude-boards none --output ${{ matrix.board }}_jobs.json
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PYTHONUNBUFFERED: "1"
          MAX_CONCURRENT_JOBS: "800"
          BAMBOOHR_LIST_CONCURRENCY: "500"
          BAMBOOHR_DETAIL_CONCURRENCY: "200"
          BAMBOOHR_SKIP_DETAILS: "false"
          BAMBOOHR_POST_TIME: "day"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.board }}
          path: ${{ matrix.board }}_jobs.json

  # ── Commit: merge all shards + boards into repo ───────────────────────
  commit:
    needs: [scrape-workday, scrape-other]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all job artifacts
        uses: actions/download-artifact@v4
        with:
          path: scraped_jobs/

      - name: Merge Workday shards and move files
        run: |
          # Merge all Workday shard files into one
          python3 -c "
          import json, glob
          shards = glob.glob('scraped_jobs/jobs-Workday-*/Workday_shard_*_jobs.json')
          all_jobs = []
          seen = set()
          for f in sorted(shards):
              with open(f) as fh:
                  for job in json.load(fh):
                      jid = job.get('id', '')
                      if jid and jid not in seen:
                          seen.add(jid)
                          all_jobs.append(job)
          with open('Workday_jobs.json', 'w') as fh:
              json.dump(all_jobs, fh)
          print(f'Merged {len(shards)} shards → {len(all_jobs)} unique Workday jobs')
          "
          # Move other board files to root
          find scraped_jobs -name "*.json" ! -name "Workday_shard_*" -exec mv {} ./ \;
          rm -rf scraped_jobs

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated job fetch update (Updated Boards) 🤖"
          file_pattern: '*.json'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
