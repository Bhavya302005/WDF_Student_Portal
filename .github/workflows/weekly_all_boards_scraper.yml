name: 🚀 Ultimate Scraper (weekly all boards, daily LinkedIn + Indeed)

on:
  schedule:
    # Run every Sunday at midnight
    - cron: '0 0 * * 0'
    # Every day: LinkedIn + Indeed, jobs posted in the last 24 hours (see the plan step)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      run_merge:
        description: 'Run merge-and-commit stage'
        required: true
        default: true
        type: boolean
      reuse_artifacts_run_id:
        description: 'Optional prior run ID to reuse artifacts for merge-only recovery'
        required: false
        type: string
      ashby:
        description: 'Ashby (ATS)'
        required: true
        default: true
        type: boolean
      greenhouse:
        description: 'Greenhouse (ATS)'
        required: true
        default: true
        type: boolean
      lever:
        description: 'Lever (ATS)'
        required: true
        default: true
        type: boolean
      workday:
        description: 'Workday (ATS)'
        required: true
        default: true
        type: boolean
      smartrecruiters:
        description: 'SmartRecruiters (ATS)'
        required: true
        default: true
        type: boolean
      workable:
        description: 'Workable (ATS)'
        required: true
        default: true
        type: boolean
      icims:
        description: 'iCIMS (ATS)'
        required: true
        default: true
        type: boolean
      jobvite:
        description: 'Jobvite (ATS)'
        required: true
        default: true
        type: boolean
      bamboohr:
        description: 'BambooHR (ATS)'
        required: true
        default: true
        type: boolean
      teamtailor:
        description: 'Teamtailor (ATS)'
        required: true
        default: true
        type: boolean
      dice:
        description: 'Dice (ATS)'
        required: true
        default: true
        type: boolean
      adp:
        description: 'Adp (ATS)'
        required: true
        default: true
        type: boolean
      linkedin:
        description: 'LinkedIn'
        required: true
        default: true
        type: boolean
      indeed:
        description: 'Indeed'
        required: true
        default: true
        type: boolean
      post_time:
        description: 'Only jobs posted within this window'
        required: true
        default: week
        type: choice
        options:
          - day
          - week
          - month
          - any
      insert_to_db:
        description: 'Insert the scraped jobs into the Neon database (untick for a dry run; results are still saved as an artifact)'
        required: true
        default: true
        type: boolean
      retention_dry_run:
        description: 'Report which old jobs would be removed to make room, without deleting them (the new jobs are still inserted)'
        required: true
        default: false
        type: boolean

defaults:
  run:
    working-directory: ./dashboard

permissions:
  contents: read

jobs:
  # 0. Decide what this run does. Scheduled runs use the defaults (every board,
  #    one-week window, insert into Neon); manual runs tick the boards to scrape,
  #    the window and whether to insert.
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      ats: ${{ steps.plan.outputs.ats }}
      li: ${{ steps.plan.outputs.li }}
      post_time: ${{ steps.plan.outputs.post_time }}
      insert_db: ${{ steps.plan.outputs.insert_db }}
      expire: ${{ steps.plan.outputs.expire }}
      expire_boards: ${{ steps.plan.outputs.expire_boards }}
    steps:
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUTS: ${{ toJSON(inputs) }}
          POST_TIME: ${{ inputs.post_time || 'week' }}
          INSERT_DB: ${{ github.event_name != 'workflow_dispatch' || inputs.insert_to_db }}
          REUSE: ${{ inputs.reuse_artifacts_run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          ATS = ["Ashby", "Greenhouse", "Lever", "Workday", "SmartRecruiters", "Workable",
                 "iCIMS", "Jobvite", "BambooHR", "Teamtailor", "Dice", "Adp"]
          LI = ["LinkedIn", "Indeed"]
          env = os.environ
          inputs = json.loads(env.get("INPUTS") or "null") or {}
          manual = env["EVENT"] == "workflow_dispatch"
          # The daily schedule scrapes LinkedIn and Indeed for the last 24 hours: their public searches show
          # at most ~1,000 jobs each, so a week of postings for a big role does not fit, a day does
          daily = env.get("SCHEDULE") == "0 9 * * *"
          if daily:
              env["POST_TIME"] = "day"
          # The weekly schedule scrapes every board; manual runs scrape the ticked ones
          picked = (LI if daily else
                    [b for b in ATS + LI if not manual or str(inputs.get(b.lower())).lower() == "true"])
          if not picked:
              raise SystemExit("No board ticked: tick at least one board to scrape.")
          # Jobs a run did not see are retired only for the boards it scraped, and not after
          # a one-day window or reused artifacts (every older job would look gone).
          expire = env["POST_TIME"] != "day" and not env["REUSE"]
          out = {"ats": json.dumps([b for b in ATS if b in picked]),
                 "li": json.dumps([b.lower() for b in LI if b in picked]),
                 "post_time": env["POST_TIME"], "insert_db": env["INSERT_DB"],
                 "expire": str(expire).lower(),
                 # Empty = every board (scheduled runs and all-ticked runs)
                 "expire_boards": "" if len(picked) == len(ATS + LI) else ",".join(picked)}
          with open(env["GITHUB_OUTPUT"], "a") as handle:
              for key, value in out.items():
                  handle.write(f"{key}={value}\n")
          print(out)
          PY

  # 1. Scrape ATS Boards (Lever, Greenhouse, Ashby, Workday, etc.)
  scrape-ats:
    needs: plan
    if: ${{ needs.plan.outputs.ats != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.plan.outputs.ats) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # A board that fails or times out still hands over the jobs it saved so far (it writes as it goes); only a
      # clean finish earns the "complete" marker that lets the merge retire jobs the board no longer lists.
      - name: Run Scraper for ${{ matrix.board }}
        id: scrape
        continue-on-error: true
        timeout-minutes: 330
        run: |
          python pipeline.py --type-a-only --local-only --boards ${{ matrix.board }} --exclude-boards none --post-time ${{ needs.plan.outputs.post_time }} --output ${{ matrix.board }}_jobs_weekly.json
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PYTHONUNBUFFERED: "1"
          MAX_CONCURRENT_JOBS: "800"
          # Workday: skip per-JD detail fetching — 147k JDs at 2/s = never finishes.
          # We collect all job listings (title, company, location, post_date) which
          # is enough for the matching pipeline. Run a targeted JD pass separately.
          WORKDAY_COMPANY_CONCURRENCY: "600"
          WORKDAY_SKIP_DETAILS: "true"
          WORKDAY_POST_TIME: ${{ needs.plan.outputs.post_time }}
          BAMBOOHR_LIST_CONCURRENCY: "500"
          BAMBOOHR_DETAIL_CONCURRENCY: "200"
          BAMBOOHR_SKIP_DETAILS: "false"
          BAMBOOHR_POST_TIME: ${{ needs.plan.outputs.post_time }}
          WORKABLE_POST_TIME: ${{ needs.plan.outputs.post_time }}
          GREENHOUSE_CONCURRENCY: "800"
          DEFAULT_POST_TIME: ${{ needs.plan.outputs.post_time }}
          API_POST_TIME: ${{ needs.plan.outputs.post_time }}
          GOOGLE_POST_TIME: ${{ needs.plan.outputs.post_time }}
          SKIP_DETAILS: "false"

      - name: Upload ATS Artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jobs-ats-${{ matrix.board }}
          path: dashboard/${{ matrix.board }}_jobs_weekly.json
          if-no-files-found: ignore

      - name: Mark ${{ matrix.board }} complete
        if: ${{ steps.scrape.outcome == 'success' }}
        run: echo "${{ matrix.board }}" > "${{ runner.temp }}/complete.txt"
      - name: Upload complete marker
        if: ${{ steps.scrape.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ok-ats-${{ matrix.board }}
          path: ${{ runner.temp }}/complete.txt

  # 2. Scrape LinkedIn & Indeed for the 68 roles (Sharded)
  scrape-li-indeed:
    needs: plan
    if: ${{ needs.plan.outputs.li != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.plan.outputs.li) }}
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install python-jobspy pandas python-dotenv openpyxl httpx

      # LinkedIn throttles GitHub's shared runners: no --fast, and the scraper stops itself after
      # LINKEDIN_TIME_BUDGET_MIN (saving what it has, exit 3 = partial) instead of waiting out a 6 h limit.
      - name: Run ${{ matrix.board }} Shard ${{ matrix.shard }} (post time ${{ needs.plan.outputs.post_time }}, full details)
        id: scrape
        continue-on-error: true
        timeout-minutes: 150
        run: |
          if [ "${{ matrix.board }}" = "linkedin" ]; then
            python linkedin/linkedin_68_roles.py --post-time ${{ needs.plan.outputs.post_time }} --shard "${{ matrix.shard }}" --max-results all
          else
            python indeed/indeed_68_roles.py --post-time ${{ needs.plan.outputs.post_time }} --shard "${{ matrix.shard }}" --fast --max-results all
          fi
        env:
          PYTHONUNBUFFERED: "1"
          LINKEDIN_TIME_BUDGET_MIN: "120"

      - name: Upload LI/Indeed Artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.board }}-${{ strategy.job-index }}
          path: |
            dashboard/linkedin/linkedin_jobs/*shard*
            dashboard/indeed/indeed_jobs/*shard*
          if-no-files-found: ignore

      - name: Mark shard complete
        if: ${{ steps.scrape.outcome == 'success' }}
        run: echo "${{ matrix.board }}" > "${{ runner.temp }}/complete.txt"
      - name: Upload complete marker
        if: ${{ steps.scrape.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ok-${{ matrix.board }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/complete.txt

  # 3. Merge everything and commit to repo
  merge-and-commit:
    needs: [plan, scrape-ats, scrape-li-indeed]
    if: >-
      ${{
        !cancelled() &&
        needs.plan.result == 'success' &&
        (github.event_name != 'workflow_dispatch' || inputs.run_merge)
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all job artifacts (current run)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_artifacts_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          path: dashboard/scraped_data/

      - name: Download all job artifacts (previous run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_artifacts_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          path: dashboard/scraped_data/
          run-id: ${{ inputs.reuse_artifacts_run_id }}

      - name: Which boards finished cleanly
        id: complete
        working-directory: .
        env:
          ATS: ${{ needs.plan.outputs.ats }}
          LI: ${{ needs.plan.outputs.li }}
          EXPIRE: ${{ needs.plan.outputs.expire }}
        run: |
          python3 - <<'PY'
          import json, os, glob
          base = 'dashboard/scraped_data'
          ats, li = json.loads(os.environ['ATS']), json.loads(os.environ['LI'])
          done = [b for b in ats if glob.glob(f'{base}/ok-ats-{b}')]
          # LinkedIn and Indeed run as 8 shards: the board is complete only when every shard finished cleanly
          done += [b for b in li if len(glob.glob(f'{base}/ok-{b}-*')) >= 8]
          missing = [b for b in ats + li if b not in done]
          expire = os.environ['EXPIRE'] == 'true' and bool(done)
          out = {'expire': str(expire).lower(), 'expire_boards': ','.join(done)}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              for key, value in out.items():
                  handle.write(f'{key}={value}\n')
          summary = os.environ['GITHUB_STEP_SUMMARY']
          with open(summary, 'a') as handle:
              handle.write('### Scrape completeness\n')
              handle.write(f'- Finished cleanly: {", ".join(done) or "none"}\n')
              if missing:
                  handle.write(f'- **Partial or failed** (their saved jobs are still merged, but nothing is retired from them): {", ".join(missing)}\n')
          print(out, 'partial:', missing)
          PY

      - name: Consolidate and Merge Data
        run: |
          # 1. Move the ATS JSON files to root (|| true so it doesn't fail if no ATS shards exist)
          find scraped_data -name "*_jobs_weekly.json" -exec mv {} ./ \; || true

          # 2. Merge LinkedIn & Indeed shards into master CSVs
          python3 -c "
          import ast, json, glob, os, re, csv

          # Read the static ROLES declaration without importing the scraper.
          # Importing it would load pandas/JobSpy, which a merge-only runner
          # deliberately does not need.
          source = open('indeed/indeed_68_roles.py', encoding='utf-8').read()
          tree = ast.parse(source)
          roles_node = next(
              node for node in tree.body
              if isinstance(node, (ast.Assign, ast.AnnAssign))
              and ((isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'ROLES' for t in node.targets))
                   or (isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == 'ROLES'))
          )
          ROLES = ast.literal_eval(roles_node.value)

          roles_sorted = sorted([r.lower() for r in ROLES], key=len, reverse=True)
          strict_pattern = re.compile(r'\\b(' + '|'.join(re.escape(r) for r in roles_sorted) + r')\\b', re.IGNORECASE)

          def write_csv(items, path):
              if not items: return
              fieldnames = ['Index_No']
              for item in items:
                  for key in item.keys():
                      if key != 'Index_No' and key not in fieldnames:
                          fieldnames.append(key)
              with open(path, 'w', encoding='utf-8', newline='') as fp:
                  writer = csv.DictWriter(fp, fieldnames=fieldnames, quoting=csv.QUOTE_NONNUMERIC, extrasaction='ignore')
                  writer.writeheader()
                  for idx, item in enumerate(items, start=1):
                      row = dict(item)
                      row['Index_No'] = idx
                      writer.writerow(row)

          def read_shard(filepath):
              if filepath.endswith('.json'):
                  with open(filepath, 'r', encoding='utf-8') as f:
                      data = json.load(f)
                      return data if isinstance(data, list) else []
              elif filepath.endswith('.csv'):
                  with open(filepath, 'r', encoding='utf-8') as f: return list(csv.DictReader(f))
              return []

          li_files = sorted(glob.glob('scraped_data/**/linkedin_shard_*_jobs.*', recursive=True))
          ind_files = sorted(glob.glob('scraped_data/**/indeed_shard_*_jobs.*', recursive=True))
          print(f'Found {len(li_files)} LinkedIn shard files, {len(ind_files)} Indeed shard files')

          li_jobs, ind_jobs, seen = [], [], set()

          for f in li_files:
              for j in read_shard(f):
                  jid = j.get('id') or (str(j.get('title',''))+str(j.get('company',''))+str(j.get('location','')))
                  if jid and jid not in seen:
                      seen.add(jid); li_jobs.append(j)

          for f in ind_files:
              for j in read_shard(f):
                  jid = j.get('id') or (str(j.get('title',''))+str(j.get('company',''))+str(j.get('location','')))
                  if jid and jid not in seen:
                      seen.add(jid); ind_jobs.append(j)

          print(f'Merged: {len(li_jobs)} LinkedIn jobs, {len(ind_jobs)} Indeed jobs')

          if li_jobs:
              os.makedirs('linkedin/linkedin_jobs', exist_ok=True)
              write_csv(li_jobs, 'linkedin/linkedin_jobs/linkedin_68roles_jobs_us.csv')
              li_strict = [j for j in li_jobs if strict_pattern.search(str(j.get('job_title', '')))]
              write_csv(li_strict, 'linkedin/linkedin_jobs/linkedin_68roles_jobs_us_strict.csv')
              print(f'LinkedIn: {len(li_jobs)} total, {len(li_strict)} strict')

          if ind_jobs:
              os.makedirs('indeed/indeed_jobs', exist_ok=True)
              write_csv(ind_jobs, 'indeed/indeed_jobs/indeed_68roles_jobs_us.csv')
              ind_strict = [j for j in ind_jobs if strict_pattern.search(str(j.get('job_title', '')))]
              write_csv(ind_strict, 'indeed/indeed_jobs/indeed_68roles_jobs_us_strict.csv')
              print(f'Indeed: {len(ind_jobs)} total, {len(ind_strict)} strict')

          combined = li_jobs + ind_jobs
          combined_strict = [j for j in combined if strict_pattern.search(str(j.get('job_title', '')))]
          if combined:
              write_csv(combined, 'all_68roles_jobs_us.csv')
              write_csv(combined_strict, 'all_68roles_jobs_us_strict.csv')
              print(f'Combined: {len(combined)} total, {len(combined_strict)} strict')
          "
          rm -rf scraped_data || true

      - name: Build final Excel + CSV deliverables
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pandas openpyxl
          python3 -m job_extraction.enrich_csv linkedin/linkedin_jobs/linkedin_68roles_jobs_us.csv --board LinkedIn
          python3 -m job_extraction.enrich_csv linkedin/linkedin_jobs/linkedin_68roles_jobs_us_strict.csv --board LinkedIn
          python3 -m job_extraction.enrich_csv indeed/indeed_jobs/indeed_68roles_jobs_us.csv --board Indeed
          python3 -m job_extraction.enrich_csv indeed/indeed_jobs/indeed_68roles_jobs_us_strict.csv --board Indeed
          python3 -c "
          import re, csv, os, pandas as pd

          ILLEGAL = re.compile(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f-\x84\x86-\x9f\ud800-\udfff\ufffe\uffff]')

          def load_csv(path):
              if not os.path.exists(path):
                  return pd.DataFrame()
              return pd.read_csv(path, dtype=str)

          def clean(df):
              for col in df.columns:
                  df[col] = df[col].fillna('').astype(str).str.replace(r'\r\n|\r|\n', ' ', regex=True)
                  df[col] = df[col].apply(lambda x: ILLEGAL.sub('', str(x)))
              return df

          li_all    = load_csv('linkedin/linkedin_jobs/linkedin_68roles_jobs_us.csv')
          li_strict = load_csv('linkedin/linkedin_jobs/linkedin_68roles_jobs_us_strict.csv')
          in_all    = load_csv('indeed/indeed_jobs/indeed_68roles_jobs_us.csv')
          in_strict = load_csv('indeed/indeed_jobs/indeed_68roles_jobs_us_strict.csv')

          # Strict: LinkedIn + Indeed strict rows combined (deduplicated by id)
          strict_li  = li_strict.copy() if not li_strict.empty else pd.DataFrame()
          strict_ind = in_strict.copy() if not in_strict.empty else pd.DataFrame()

          # Other = all rows whose id is NOT in strict
          strict_ids = set()
          if not li_strict.empty and 'id' in li_strict.columns:
              strict_ids |= set(li_strict['id'].dropna())
          if not in_strict.empty and 'id' in in_strict.columns:
              strict_ids |= set(in_strict['id'].dropna())

          other_li  = li_all[~li_all['id'].isin(strict_ids)].copy()  if not li_all.empty  else pd.DataFrame()
          other_ind = in_all[~in_all['id'].isin(strict_ids)].copy()  if not in_all.empty  else pd.DataFrame()

          os.makedirs('deliverables', exist_ok=True)

          # ── strict_jobs.xlsx  (LinkedIn | Indeed sheets) ──────────────────────
          with pd.ExcelWriter('deliverables/strict_jobs.xlsx', engine='openpyxl') as w:
              clean(strict_li).reset_index(drop=True).to_excel(w, sheet_name='LinkedIn', index=False)
              clean(strict_ind).reset_index(drop=True).to_excel(w, sheet_name='Indeed',   index=False)
          print(f'strict_jobs.xlsx  → LinkedIn: {len(strict_li)}, Indeed: {len(strict_ind)}')

          # ── other_jobs.xlsx  (LinkedIn | Indeed sheets) ───────────────────────
          with pd.ExcelWriter('deliverables/other_jobs.xlsx', engine='openpyxl') as w:
              clean(other_li).reset_index(drop=True).to_excel(w, sheet_name='LinkedIn', index=False)
              clean(other_ind).reset_index(drop=True).to_excel(w, sheet_name='Indeed',   index=False)
          print(f'other_jobs.xlsx   → LinkedIn: {len(other_li)}, Indeed: {len(other_ind)}')

          # ── strict_jobs.csv  (all platforms combined, 1 row per job) ─────────
          strict_all = pd.concat([strict_li, strict_ind], ignore_index=True)
          if 'id' in strict_all.columns:
              strict_all = strict_all.drop_duplicates(subset=['id'], keep='first')
          strict_all = strict_all.drop(columns=['Index_No'], errors='ignore')
          strict_all.insert(0, 'Index_No', range(1, len(strict_all)+1))
          clean(strict_all).to_csv('deliverables/strict_jobs.csv', index=False)
          print(f'strict_jobs.csv   → {len(strict_all)} rows')

          # ── other_jobs.csv  (all platforms combined, 1 row per job) ──────────
          other_all = pd.concat([other_li, other_ind], ignore_index=True)
          if 'id' in other_all.columns:
              other_all = other_all.drop_duplicates(subset=['id'], keep='first')
          other_all = other_all.drop(columns=['Index_No'], errors='ignore')
          other_all.insert(0, 'Index_No', range(1, len(other_all)+1))
          clean(other_all).to_csv('deliverables/other_jobs.csv', index=False)
          print(f'other_jobs.csv    → {len(other_all)} rows')
          "

      - name: Upload final job deliverables
        uses: actions/upload-artifact@v4
        with:
          name: job-results
          path: |
            dashboard/deliverables/strict_jobs.xlsx
            dashboard/deliverables/other_jobs.xlsx
            dashboard/deliverables/strict_jobs.csv
            dashboard/deliverables/other_jobs.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Install psycopg for Neon upsert
        if: ${{ needs.plan.outputs.insert_db == 'true' }}
        run: pip install "psycopg[binary]"

      - name: Audit merged job field completeness
        continue-on-error: true
        run: |
          python3 audit_job_fields.py \
            linkedin/linkedin_jobs/linkedin_68roles_jobs_us.csv \
            indeed/indeed_jobs/indeed_68roles_jobs_us.csv \
            "*_jobs_weekly.json"

      # Fails visibly when any batch is rejected (e.g. storage quota), instead
      # of reporting a green run with a partially updated database.
      - name: Database insert skipped (insert_to_db is off)
        if: ${{ needs.plan.outputs.insert_db != 'true' }}
        run: |
          echo "### Dry run: nothing was written to the database" >> "$GITHUB_STEP_SUMMARY"
          echo "The scraped jobs are in this run's artifacts: **jobs-ats-<Board>** for ATS boards, **job-results** for LinkedIn/Indeed." >> "$GITHUB_STEP_SUMMARY"

      - name: Push jobs to Neon (public.jobs)
        if: ${{ needs.plan.outputs.insert_db == 'true' }}
        run: |
          python3 -c "
          import json, glob, csv, logging, os, sys
          sys.path.insert(0, '.')
          logging.basicConfig(level=logging.INFO, format='%(levelname)s %(message)s')
          from db.neon_upsert import save_jobs

          all_jobs = []

          # LinkedIn / Indeed first: they are small and must not be starved
          # by a failure partway through the large ATS sources.
          for pattern in ['linkedin/linkedin_jobs/linkedin_68roles_jobs_us.csv', 'indeed/indeed_jobs/indeed_68roles_jobs_us.csv']:
              for f in glob.glob(pattern):
                  try:
                      rows = list(csv.DictReader(open(f, encoding='utf-8')))
                      board = 'LinkedIn' if 'linkedin' in f else 'Indeed'
                      for r in rows:
                          r.setdefault('source_board', board)
                      all_jobs.extend(rows)
                      print(f'Loaded {len(rows)} rows from {f}')
                  except Exception as e:
                      print(f'Skip {f}: {e}')

          # Load ATS JSON boards
          for f in glob.glob('*.json'):
              try:
                  data = json.load(open(f, encoding='utf-8'))
                  jobs = data if isinstance(data, list) else []
                  board = f.replace('_jobs_weekly.json', '')
                  for j in jobs:
                      j.setdefault('source_board', board)
                  all_jobs.extend(jobs)
                  print(f'Loaded {len(jobs)} jobs from {f}')
              except Exception as e:
                  print(f'Skip {f}: {e}')

          print(f'Total jobs to upsert: {len(all_jobs)}')
          boards = [b for b in os.environ.get('EXPIRE_BOARDS', '').split(',') if b]
          n = save_jobs(all_jobs, expire_missing=os.environ.get('EXPIRE_MISSING') == 'true',
                        expire_boards=boards or None)
          print(f'Neon upsert complete: {n} rows')
          "
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          # More room for jobs: new jobs go to whichever database has most free space (empty = main only)
          JOBS_DATABASE_URL_2: ${{ secrets.JOBS_DATABASE_URL_2 }}
          # Jobs this run's boards no longer list are retired (see plan).
          EXPIRE_MISSING: ${{ steps.complete.outputs.expire }}
          EXPIRE_BOARDS: ${{ steps.complete.outputs.expire_boards }}
          # Storage: before inserting, remove the stalest jobs so the new ones fit (see db/neon_upsert.py).
          # Each Neon project's storage limit (repository variable JOBS_DB_MAX_MB, default 1 GB;
          # JOBS_DB_MAX_MB_2 for the second database if it differs).
          JOBS_DB_MAX_MB: ${{ vars.JOBS_DB_MAX_MB || '1024' }}
          JOBS_DB_MAX_MB_2: ${{ vars.JOBS_DB_MAX_MB_2 }}
          JOB_EXPIRE_DAYS: ${{ vars.JOB_EXPIRE_DAYS || '14' }}
          JOB_PURGE_EXPIRED_DAYS: ${{ vars.JOB_PURGE_EXPIRED_DAYS || '7' }}
          JOB_RETENTION_DRY_RUN: ${{ inputs.retention_dry_run || 'false' }}
