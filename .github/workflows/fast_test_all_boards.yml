name: 🚀 Fast Test (100 Companies + 30 Roles Validation)

on:
  workflow_dispatch:
    inputs:
      roles_limit:
        description: 'Number of roles to scrape (from 68 roles list)'
        required: true
        default: '30'
        type: string
      companies_limit:
        description: 'Max companies per ATS board'
        required: true
        default: '100'
        type: string
      max_results:
        description: 'Max job results per role for LI/Indeed'
        required: true
        default: '25'
        type: string

defaults:
  run:
    working-directory: ./dashboard

permissions:
  contents: read

jobs:
  # 1. Scrape ATS Boards (Trimmed to 100 Companies for fast validation)
  scrape-ats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [Ashby, Greenhouse, Lever, Workday, SmartRecruiters, Workable, iCIMS, Jobvite, BambooHR, Teamtailor, Adp]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Trim companies to ${{ inputs.companies_limit || '100' }}
        run: |
          LIMIT="${{ inputs.companies_limit || '100' }}"
          echo "Trimming company lists to first $LIMIT entries for quick validation..."
          for f in $(find . -maxdepth 2 -name "*companies.txt"); do
            head -n "$LIMIT" "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
          done
          CSV_LIMIT=$((LIMIT + 1))
          for f in $(find . -maxdepth 2 -name "*companies.csv" -o -name "workday.csv" -o -name "adp.csv" -o -name "teamtailor.csv"); do
            head -n "$CSV_LIMIT" "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
          done

      - name: Run Scraper for ${{ matrix.board }}
        timeout-minutes: 60
        run: |
          python pipeline.py --type-a-only --local-only --boards ${{ matrix.board }} --exclude-boards none --output ${{ matrix.board }}_jobs_weekly.json
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PYTHONUNBUFFERED: "1"
          MAX_CONCURRENT_JOBS: "800"
          WORKDAY_COMPANY_CONCURRENCY: "600"
          WORKDAY_SKIP_DETAILS: "true"
          WORKDAY_POST_TIME: "week"
          BAMBOOHR_LIST_CONCURRENCY: "500"
          BAMBOOHR_DETAIL_CONCURRENCY: "200"
          BAMBOOHR_SKIP_DETAILS: "false"
          BAMBOOHR_POST_TIME: "week"
          GREENHOUSE_CONCURRENCY: "800"
          DEFAULT_POST_TIME: "week"
          SKIP_DETAILS: "false"

      - name: Upload ATS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobs-ats-${{ matrix.board }}
          path: dashboard/${{ matrix.board }}_jobs_weekly.json
          if-no-files-found: ignore

  # 2. Scrape Dice for the top 30 roles
  scrape-dice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install httpx python-dotenv

      - name: Run Dice for ${{ inputs.roles_limit || '30' }} Roles
        timeout-minutes: 30
        run: |
          python Dice/dice.py --limit ${{ inputs.roles_limit || '30' }} --max-pages 1 --post-time week --output Dice_jobs_weekly.json --no-supabase
        env:
          PYTHONUNBUFFERED: "1"
          DICE_CONCURRENCY: "10"
          DICE_DESC_CONCURRENCY: "50"

      - name: Upload Dice Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobs-ats-Dice
          path: dashboard/Dice_jobs_weekly.json
          if-no-files-found: ignore

  # 3. Scrape LinkedIn & Indeed for the top 30 roles (Sharded across 3 runners)
  scrape-li-indeed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [linkedin, indeed]
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install python-jobspy pandas python-dotenv openpyxl httpx

      - name: Run ${{ matrix.board }} Shard ${{ matrix.shard }} (Top ${{ inputs.roles_limit || '30' }} Roles)
        timeout-minutes: 60
        run: |
          LIMIT="${{ inputs.roles_limit || '30' }}"
          MAX_RES="${{ inputs.max_results || '25' }}"
          if [ "${{ matrix.board }}" = "linkedin" ]; then
            python linkedin/linkedin_68_roles.py --post-time week --limit "$LIMIT" --shard "${{ matrix.shard }}" --fast --max-results "$MAX_RES"
          else
            python indeed/indeed_68_roles.py --post-time week --limit "$LIMIT" --shard "${{ matrix.shard }}" --fast --max-results "$MAX_RES"
          fi
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload LI/Indeed Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.board }}-${{ strategy.job-index }}
          path: |
            dashboard/linkedin/linkedin_jobs/*shard*
            dashboard/indeed/indeed_jobs/*shard*
          if-no-files-found: ignore

  # 4. Merge everything and commit to repo
  merge-and-commit:
    needs: [scrape-ats, scrape-dice, scrape-li-indeed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all job artifacts
        uses: actions/download-artifact@v4
        with:
          path: dashboard/scraped_data/

      - name: Consolidate and Merge Data
        run: |
          # 1. Move ATS JSON files to root
          find scraped_data -name "*_jobs_weekly.json" -exec mv {} ./ \; || true

          # 2. Merge LinkedIn & Indeed shards into master CSVs
          python3 -c "
          import ast, json, glob, os, re, csv

          source = open('indeed/indeed_68_roles.py', encoding='utf-8').read()
          tree = ast.parse(source)
          roles_node = next(
              node for node in tree.body
              if isinstance(node, (ast.Assign, ast.AnnAssign))
              and ((isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'ROLES' for t in node.targets))
                   or (isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == 'ROLES'))
          )
          ROLES = ast.literal_eval(roles_node.value)

          roles_sorted = sorted([r.lower() for r in ROLES], key=len, reverse=True)
          strict_pattern = re.compile(r'\\b(' + '|'.join(re.escape(r) for r in roles_sorted) + r')\\b', re.IGNORECASE)

          def write_csv(items, path):
              if not items: return
              fieldnames = list(items[0].keys())
              if 'Index_No' not in fieldnames: fieldnames = ['Index_No'] + fieldnames
              with open(path, 'w', encoding='utf-8', newline='') as fp:
                  writer = csv.DictWriter(fp, fieldnames=fieldnames, quoting=csv.QUOTE_NONNUMERIC)
                  writer.writeheader()
                  for idx, item in enumerate(items, start=1):
                      row = dict(item)
                      row['Index_No'] = idx
                      writer.writerow(row)

          def read_shard(filepath):
              if filepath.endswith('.json'):
                  with open(filepath, 'r', encoding='utf-8') as f:
                      data = json.load(f)
                      return data if isinstance(data, list) else []
              elif filepath.endswith('.csv'):
                  with open(filepath, 'r', encoding='utf-8') as f: return list(csv.DictReader(f))
              return []

          li_files = sorted(glob.glob('scraped_data/**/linkedin_shard_*_jobs.*', recursive=True))
          ind_files = sorted(glob.glob('scraped_data/**/indeed_shard_*_jobs.*', recursive=True))
          print(f'Found {len(li_files)} LinkedIn shard files, {len(ind_files)} Indeed shard files')

          li_jobs, ind_jobs, seen = [], [], set()

          for f in li_files:
              for j in read_shard(f):
                  jid = j.get('id') or (str(j.get('title',''))+str(j.get('company',''))+str(j.get('location','')))
                  if jid and jid not in seen:
                      seen.add(jid); li_jobs.append(j)

          for f in ind_files:
              for j in read_shard(f):
                  jid = j.get('id') or (str(j.get('title',''))+str(j.get('company',''))+str(j.get('location','')))
                  if jid and jid not in seen:
                      seen.add(jid); ind_jobs.append(j)

          print(f'Merged: {len(li_jobs)} LinkedIn jobs, {len(ind_jobs)} Indeed jobs')

          if li_jobs:
              os.makedirs('linkedin/linkedin_jobs', exist_ok=True)
              write_csv(li_jobs, 'linkedin/linkedin_jobs/linkedin_68roles_jobs_us.csv')
              li_strict = [j for j in li_jobs if strict_pattern.search(str(j.get('job_title', '')))]
              write_csv(li_strict, 'linkedin/linkedin_jobs/linkedin_68roles_jobs_us_strict.csv')
              print(f'LinkedIn: {len(li_jobs)} total, {len(li_strict)} strict')

          if ind_jobs:
              os.makedirs('indeed/indeed_jobs', exist_ok=True)
              write_csv(ind_jobs, 'indeed/indeed_jobs/indeed_68roles_jobs_us.csv')
              ind_strict = [j for j in ind_jobs if strict_pattern.search(str(j.get('job_title', '')))]
              write_csv(ind_strict, 'indeed/indeed_jobs/indeed_68roles_jobs_us_strict.csv')
              print(f'Indeed: {len(ind_jobs)} total, {len(ind_strict)} strict')

          combined = li_jobs + ind_jobs
          combined_strict = [j for j in combined if strict_pattern.search(str(j.get('job_title', '')))]
          if combined:
              write_csv(combined, 'all_68roles_jobs_us.csv')
              write_csv(combined_strict, 'all_68roles_jobs_us_strict.csv')
              print(f'Combined: {len(combined)} total, {len(combined_strict)} strict')
          "
          rm -rf scraped_data || true

      - name: Pull latest changes (rebase to avoid diverged history)
        run: |
          git fetch origin main
          git rebase origin/main || git rebase --abort

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fast validation run: merged jobs (100 companies + 30 roles) 🤖"
          file_pattern: 'dashboard/*.csv dashboard/linkedin/linkedin_jobs/*.csv dashboard/indeed/indeed_jobs/*.csv'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
