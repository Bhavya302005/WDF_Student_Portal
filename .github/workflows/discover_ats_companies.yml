name: Discover ATS Companies (Common Crawl)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to discover (comma-separated: workday,oracle,greenhouse,lever,ashby,smartrecruiter,jobvite,icims,bamboohr,teamtailor,workable)"
        required: false
        default: "workday,oracle,greenhouse,lever,ashby,smartrecruiter,jobvite,icims,bamboohr,teamtailor,workable"
        type: string
      dry_run:
        description: "Dry run (report only, don't add to company lists)"
        required: false
        default: false
        type: boolean

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Fetch scraper code
        run: |
          if [ -n "${{ secrets.SCRAPER_REPO }}" ] && \
             ! find . -name "discover_commoncrawl.py" -not -path "./.git/*" | grep -q .; then
            echo "Cloning scraper repo..."
            git clone "https://${{ secrets.SCRAPER_PAT }}@github.com/${{ secrets.SCRAPER_REPO }}.git" _scrapers
            echo "Clone contents:"
            find _scrapers -maxdepth 3 -name "*.py" | head -30
          else
            echo "discover_commoncrawl.py already present or SCRAPER_REPO not set"
          fi

      - name: Find scraper root
        id: root
        run: |
          echo "DEBUG: listing top-level dirs"
          ls -d */ 2>/dev/null || true
          echo "DEBUG: searching for discover_commoncrawl.py everywhere"
          find . -name "discover_commoncrawl.py" -not -path "./.git/*" 2>/dev/null || true
          echo "---"
          FOUND=$(find . -name "discover_commoncrawl.py" -not -path "./.git/*" 2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            DIR=$(dirname "$FOUND")
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
            echo "Found at: $FOUND (dir=$DIR)"
          else
            echo "ERROR: discover_commoncrawl.py not found anywhere"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet httpx pandas python-dotenv

      - name: Run Common Crawl discovery
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          IFS=',' read -ra PLATFORMS <<< "${{ inputs.platforms || 'workday,oracle,greenhouse,lever,ashby,smartrecruiter,jobvite,icims,bamboohr,teamtailor,workable' }}"
          for platform in "${PLATFORMS[@]}"; do
            platform=$(echo "$platform" | xargs)
            echo "========================================"
            echo "Discovering: $platform"
            echo "========================================"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              python3 discover_commoncrawl.py "$platform"
            else
              python3 discover_commoncrawl.py "$platform" --apply
            fi
          done

      - name: Commit updated company lists
        if: ${{ inputs.dry_run != true }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: discover new ATS companies via Common Crawl"
          file_pattern: |
            **/*workday.csv **/oracle.csv
            **/*greenhouse_companies.txt **/*lever_companies.txt
            **/*ashby_companies.txt **/*smartrecruiter_companies.txt
            **/*jobvite_companies.txt **/icims.csv
            **/bamboohr.csv **/teamtailor.csv
            **/workable.csv
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
