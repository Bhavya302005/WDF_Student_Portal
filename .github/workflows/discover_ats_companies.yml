name: Discover ATS Companies (Common Crawl)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to discover (comma-separated: workday,oracle,greenhouse,lever,ashby,smartrecruiter,jobvite,icims,bamboohr,teamtailor,workable)"
        required: false
        default: "workday,oracle,greenhouse,lever,ashby,smartrecruiter,jobvite,icims,bamboohr,teamtailor,workable"
        type: string
      dry_run:
        description: "Dry run (report only, don't add to company lists)"
        required: false
        default: false
        type: boolean

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet httpx pandas python-dotenv

      - name: Run Common Crawl discovery
        id: discovery
        working-directory: dashboard
        env:
          DISCOVERY_PLATFORMS: ${{ inputs.platforms || 'workday,oracle,greenhouse,lever,ashby,smartrecruiter,jobvite,icims,bamboohr,teamtailor,workable' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          IFS=',' read -ra PLATFORMS <<< "$DISCOVERY_PLATFORMS"
          failed=0
          for platform in "${PLATFORMS[@]}"; do
            platform=$(echo "$platform" | xargs)
            echo "========================================"
            echo "Discovering: $platform"
            echo "========================================"
            args=("$platform")
            if [ "$DRY_RUN" != "true" ]; then
              args+=(--apply)
            fi
            if python3 discover_commoncrawl.py "${args[@]}"; then
              echo "Discovery succeeded: $platform"
            else
              echo "::error::Discovery failed for $platform; continuing other platforms"
              failed=1
            fi
          done
          exit "$failed"

      - name: Commit updated company lists
        if: ${{ always() && !cancelled() && inputs.dry_run != true }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: discover new ATS companies via Common Crawl"
          file_pattern: |
            **/*workday.csv **/oracle.csv
            **/*greenhouse_companies.txt **/*lever_companies.txt
            **/*ashby_companies.txt **/*smartrecruiter_companies.txt
            **/*jobvite_companies.txt **/icims.csv
            **/bamboohr.csv **/teamtailor.csv
            **/workable.csv
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
