name: Catch-up Scraper (Missed Boards)

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [SmartRecruiters, Workable, iCIMS]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Scraper for ${{ matrix.board }}
        run: |
          python pipeline.py --type-a-only --local-only --boards ${{ matrix.board }} --exclude-boards none --output ${{ matrix.board }}_jobs.json
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.board }}
          path: ${{ matrix.board }}_jobs.json

  commit:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all job artifacts
        uses: actions/download-artifact@v4
        with:
          path: scraped_jobs/
          
      - name: Move files to root directory
        run: |
          find scraped_jobs -name "*.json" -exec mv {} ./ \;
          rm -rf scraped_jobs

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated job fetch update (Missed Boards) 🤖"
          file_pattern: '*.json'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
