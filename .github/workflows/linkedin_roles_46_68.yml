name: LinkedIn Roles 46-68

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      state_split_mode:
        description: "auto: split capped nationwide searches by US state; all: always search every US state"
        required: false
        default: auto
        type: choice
        options: [auto, all]
      post_time:
        description: "How far back to look for jobs"
        required: false
        default: week
        type: choice
        options: [day, week, 3week, month, any]
      roles:
        description: "Comma-separated filters within roles 46-68; blank runs the whole range."
        required: false
        default: "Commodity Analyst, Senior Purchasing Agent, Senior Purchasing Specialist, Assistant Purchasing Agent, Purchasing Assistant, Senior Purchasing Analyst, Senior Purchasing Officer, Purchasing Coordinator, Associate Buyer, Senior Purchasing Assistant, Purchasing Supervisor, Purchase Specialist, Junior Buyer, Purchasing Officer, Senior Purchasing Manager, Purchasing Analyst, Purchasing Buyer, Materials Buyer, Assistant Buyer, Assistant Purchasing Manager, Purchasing Consultant, Purchasing Associate, Purchasing Agent"
        type: string
      shards:
        description: "Number of parallel runners"
        required: false
        default: "8"
        type: choice
        options: ["4", "8", "12", "16"]

jobs:
  scrape:
    uses: ./.github/workflows/linkedin_roles_slice.yml
    with:
      role_start: 46
      role_end: 68
      state_split_mode: ${{ inputs.state_split_mode || 'auto' }}
      post_time: ${{ inputs.post_time || 'week' }}
      roles: ${{ inputs.roles }}
      shards: ${{ inputs.shards || '8' }}
    secrets: inherit
